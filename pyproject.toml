[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "text-extraction"
version = "0.2.0"
description = "Hybrid Java/Python relational triple extraction pipeline"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
  "deep-translator>=1.11.4,<2",
  "pyjnius>=1.6.1,<2",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "ruff>=0.8",
]

[project.scripts]
text-extraction = "text_extraction.cli:main"
text-extraction-gui = "text_extraction.ui.gui:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
